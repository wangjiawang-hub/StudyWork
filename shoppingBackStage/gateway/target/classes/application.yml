server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # ⚠️ 这条必须在前面，且 Path 要精确匹配
        - id: admin-service-ws
          uri: lb:ws://admin-service
          predicates:
            - Path=/ws/**
        - id: auth
          uri: lb://auth-server
          predicates:
            - Path=/auth/**
        - id: goods
          uri: lb://goods-server
          predicates:
            - Path=/goods/**
        - id: cart
          uri: lb://carts-server
          predicates:
            - Path=/cart/**
        - id: order
          uri: lb://order-server
          predicates:
            - Path=/order/**
        - id: pay
          uri: lb://pay-server
          predicates:
            - Path=/alipay/**
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: coupon
          uri: lb://coupon-service
          predicates:
            - Path=/coupon/**
        - id: admin
          uri: lb://admin-service
          predicates:
            - Path=/admin/**
        # 人工客服 REST 归属 admin-service，须放在 /ai/** 之前
        - id: admin-chat
          uri: lb://admin-service
          predicates:
            - Path=/ai/customer/**
        - id: ai
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
        - id: openapi-auth
          uri: lb://auth-server
          predicates:
            - Path=/api-docs/auth,/api-docs/auth/**
          filters:
            - RewritePath=/api-docs/auth(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-goods
          uri: lb://goods-server
          predicates:
            - Path=/api-docs/goods,/api-docs/goods/**
          filters:
            - RewritePath=/api-docs/goods(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-cart
          uri: lb://carts-server
          predicates:
            - Path=/api-docs/cart,/api-docs/cart/**
          filters:
            - RewritePath=/api-docs/cart(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-order
          uri: lb://order-server
          predicates:
            - Path=/api-docs/order,/api-docs/order/**
          filters:
            - RewritePath=/api-docs/order(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-pay
          uri: lb://pay-server
          predicates:
            - Path=/api-docs/pay,/api-docs/pay/**
          filters:
            - RewritePath=/api-docs/pay(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-user
          uri: lb://user-service
          predicates:
            - Path=/api-docs/user,/api-docs/user/**
          filters:
            - RewritePath=/api-docs/user(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-coupon
          uri: lb://coupon-service
          predicates:
            - Path=/api-docs/coupon,/api-docs/coupon/**
          filters:
            - RewritePath=/api-docs/coupon(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-admin
          uri: lb://admin-service
          predicates:
            - Path=/api-docs/admin,/api-docs/admin/**
          filters:
            - RewritePath=/api-docs/admin(?<segment>/?.*), /v3/api-docs${segment}
        - id: openapi-ai
          uri: lb://ai-service
          predicates:
            - Path=/api-docs/ai,/api-docs/ai/**
          filters:
            - RewritePath=/api-docs/ai(?<segment>/?.*), /v3/api-docs${segment}


  data:
    redis:
      port: 6379
      host: 127.0.0.1
      password: '0504'

shopping:
  auth:
    jwt-only: true

security:
  ignore:
    whites:
      - /auth/login
      - /auth/login/code
      - /auth/admin/login
      - /auth/register
      - /auth/captcha
      - /auth/sendCode
      - /goods/**
      - /user/review/list
      - /alipay/notify
      - /ai/chat
      - /ai/chat/stream
      - /ai/sessions/**
      - /ai/customer/**
      - /ws/**
      - /api-docs/**
      - /v3/api-docs/**
      - /webjars/**
      - /swagger-ui/**
      - /swagger-ui.html

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls-primary-name: 认证服务
    urls:
      - name: 认证服务
        url: /api-docs/auth
      - name: 商品服务
        url: /api-docs/goods
      - name: 购物车服务
        url: /api-docs/cart
      - name: 订单服务
        url: /api-docs/order
      - name: 支付服务
        url: /api-docs/pay
      - name: 用户服务
        url: /api-docs/user
      - name: 优惠券服务
        url: /api-docs/coupon
      - name: 管理后台
        url: /api-docs/admin
      - name: AI服务
        url: /api-docs/ai
      - name: 网关降级
        url: /v3/api-docs
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    reactor.netty.http.server: DEBUG
    reactor.netty.http.client: DEBUG
    org.springframework.web.reactive: DEBUG
