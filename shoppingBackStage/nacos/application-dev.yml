# Nacos 共享配置：application-dev.yml
# 所有微服务 bootstrap.yml 中的 shared-configs 都会加载此文件
# Group: DEFAULT_GROUP
# 命名空间: 5b364fd6-338f-4e19-9a45-738cc3938d1c
#
# 建议：MySQL 等公共配置放这里，各服务 dev.yml 只写差异项

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shopping_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 你的MySQL密码

# 各微服务仅暴露 OpenAPI JSON，Swagger UI 统一在网关聚合
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
